<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{--bg:#f6f8fc;--fg:#1d2230;--mut:#5b6272;--key:#e6eaf3;--op:#d9e0ee;--opf:#1d2230;--eq:#d6c6f6;--eqf:#3a2a62;--ak:#bccdea;--akf:#1d2230;--ln:#d6dbe6;--card:#eef1f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e13;--fg:#e6e9f2;--mut:#9aa1b3;--key:#22252e;--op:#353b4d;--opf:#e1e5f2;--eq:#ecdcff;--eqf:#4a3a6b;--ak:#46587a;--akf:#e8ecf7;--ln:#2b2f3a;--card:#1b1e26}}
:root[data-theme="dark"]{--bg:#0c0e13;--fg:#e6e9f2;--mut:#9aa1b3;--key:#22252e;--op:#353b4d;--opf:#e1e5f2;--eq:#ecdcff;--eqf:#4a3a6b;--ak:#46587a;--akf:#e8ecf7;--ln:#2b2f3a;--card:#1b1e26}
html,body{height:100%;margin:0;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;color:var(--fg)}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:0 10px 10px}
#disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:12px 14px;overflow:hidden;min-height:90px}
#ex{font-size:26px;color:var(--mut);word-break:break-all;text-align:right;min-height:32px}
#rs{font-size:76px;line-height:1.15;word-break:break-all;text-align:right;min-height:88px}
#sci{display:none;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:6px;border-top:1px solid var(--ln);padding-top:6px}
#sci button{background:none;height:38px;font-size:15px;color:var(--mut);border-radius:19px}
#sci button.on{color:var(--opf);background:var(--op)}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#pad button{height:clamp(54px,10vh,88px);border-radius:var(--rad,30px);background:var(--key);font-size:26px}
#pad .o{background:var(--op);color:var(--opf)}
#pad .e{background:var(--eq);color:var(--eqf)}
#pad .z{grid-column:span 2}
#pad .a{background:var(--ak,var(--fk,var(--key)));color:var(--akf,var(--fkf,var(--fg)))}
:root[data-l="google"]{--rad:999px}
#pad .f{background:var(--fk,var(--key));color:var(--fkf,var(--fg))}
:root[data-l="iphone"]{--bg:#000;--fg:#fff;--mut:#a5a5a5;--key:#333;--op:#ff9f0a;--opf:#fff;--eq:#ff9f0a;--eqf:#fff;--fk:#a5a5a5;--fkf:#000;--ln:#333;--card:#1c1c1e;--rad:999px}
:root[data-l="samsung"]{--bg:#161616;--fg:#fff;--mut:#9a9a9a;--key:#262626;--op:#262626;--opf:#ff6a4d;--eq:#ff6a4d;--eqf:#fff;--fk:#262626;--fkf:#ff6a4d;--ln:#333;--card:#232323;--rad:22px}
:root[data-l="windows"]{--bg:#f3f3f3;--fg:#1b1b1b;--mut:#5f5f5f;--key:#fbfbfb;--op:#f6f6f6;--opf:#1b1b1b;--eq:#0067c0;--eqf:#fff;--fk:#f6f6f6;--ln:#e5e5e5;--card:#fff;--rad:6px}
@media(prefers-color-scheme:dark){:root[data-l="windows"]{--bg:#202020;--fg:#fff;--mut:#c5c5c5;--key:#3b3b3b;--op:#323232;--opf:#fff;--eq:#4cc2ff;--eqf:#000;--fk:#323232;--ln:#3c3c3c;--card:#2b2b2b}}
:root[data-l="windows"] #pad{gap:3px}
:root[data-l="windows"] #pad button{height:clamp(44px,7.2vh,58px);font-size:21px}
#pad button:active,#sci button:active{filter:brightness(.92)}
#ov,#vt{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
#ov{background:rgba(0,0,0,.5);z-index:10}
#vt{background:var(--bg);z-index:5;flex-direction:column;align-items:stretch;justify-content:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 24px;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
.dlg{background:var(--bg);border-radius:24px;padding:22px;width:100%;max-width:400px;max-height:90%;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.35);-webkit-user-select:text;user-select:text}
.dlg h3{margin:0 0 6px;font-weight:500;font-size:22px}
.dlg p,.mut{color:var(--mut);font-size:14px;margin:4px 0 12px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px;margin:4px 0 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--fg)}
label{font-size:12px;color:var(--mut)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.pill{background:var(--eq);color:var(--eqf);border-radius:20px;padding:10px 18px;font-size:15px}
.ghost{background:none;color:var(--opf);border-radius:20px;padding:10px 14px;font-size:15px}
.bar{display:flex;align-items:center;gap:4px;margin-bottom:10px}.bar h2{flex:1;margin:0;font-weight:500}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}.row select{margin:0}
.card{background:var(--card);border-radius:18px;padding:16px}
.f{padding:8px 0;border-bottom:1px solid var(--ln)}.f:last-of-type{border:0}
.f b{display:block;font-size:12px;color:var(--mut);font-weight:400}.f span{word-break:break-all;white-space:pre-wrap}
.sqr{display:flex;gap:6px}.sqr input{margin:2px 0 6px}
.err{color:#d93025;font-size:14px;min-height:18px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
#sb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:460px;box-sizing:border-box;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--fg);border:1px solid var(--ln);border-radius:14px;padding:6px 6px 6px 14px;font-size:14px;z-index:8;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#sb span{flex:1}
.su #disp{padding-top:76px}
.su #top{visibility:hidden}
#sci.open{display:grid}
#mx{position:fixed;inset:0;width:100%;height:100%;z-index:9;background:#000}
body.mxon #ov{background:rgba(0,0,0,.18)}
#pv{font-size:26px;color:var(--mut);min-height:34px;text-align:right}
#top{display:flex;justify-content:space-between;padding:6px 2px 0}
#top button,#chev button{background:none;width:48px;height:48px;border-radius:24px;color:var(--mut);display:flex;align-items:center;justify-content:center}
#chev{padding:0 2px}
#hv{position:fixed;inset:0;z-index:6;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 8px);max-width:480px;margin:0 auto}
#hl{overflow-y:auto;flex:1}
.hi{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.hr{flex:1;text-align:right;cursor:pointer}
.he{color:var(--mut);font-size:18px;word-break:break-all}
.hv{font-size:34px;word-break:break-all}
.hd{background:none;color:var(--mut);font-size:16px;padding:10px}
#pm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:12px;z-index:7;background:var(--card);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);padding:4px}
#pm button{background:none;font-size:16px;padding:12px 18px;color:var(--fg)}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .35s}
#splash.h{opacity:0;pointer-events:none}
#splash img{width:112px;height:112px;border-radius:25px}
</style></head>
<body>
<div id="splash"><img src="icons/icon-192.png" alt=""></div>
<div id="app"><div id="top"><button id="hbtn" aria-label="History"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button><button id="mnu" aria-label="More options"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></div><div id="disp"><div id="ex"></div><div id="rs"></div><div id="pv"></div></div><div id="chev"><button id="cv" aria-label="Scientific keys"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg></button></div><div id="sci"></div><div id="pad"></div></div><div id="hv" hidden></div><canvas id="mx" hidden></canvas><div id="pm" hidden><button id="pmc">Clear history</button></div>
<div id="vt" hidden></div><div id="ov" hidden></div><div id="toast"></div><div id="sb" hidden><span></span><button class="ghost" id="sbx">Cancel</button></div>
<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ex='',last='',res='',done=false,deg=true,inv=false,setupMode=false,V=null,K=null,items=null,sel=0,showPw=false,tt;
try{V=JSON.parse(localStorage.getItem('calc.v')||'null')}catch(e){}
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),2200)};
/* ---------- calculator ---------- */
const FN=['sin','cos','tan','asin','acos','atan','ln','log','sqrt','PI','E'];
function calc(s){
 if(!s)return '';
 let o=(s.match(/\(/g)||[]).length,c=(s.match(/\)/g)||[]).length;s+=')'.repeat(Math.max(0,o-c));
 let t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'PI').replace(/e/g,'E').replace(/√/g,'sqrt').replace(/\^/g,'**').replace(/%/g,'/100')
  .replace(/(\d|\)|PI|E)(PI|E|sqrt|a?sin|a?cos|a?tan|ln|log|\()/g,'$1*$2').replace(/(PI|E|\))(\d)/g,'$1*$2');
 const ids=t.match(/[A-Za-z]+/g)||[];if(!ids.every(i=>FN.includes(i)))return 'Error';
 if(!/^[\w+\-*/().\s]*$/.test(t))return 'Error';
 const d=x=>deg?x*Math.PI/180:x,r=x=>deg?x*180/Math.PI:x;
 try{
  const v=new Function('sin','cos','tan','asin','acos','atan','ln','log','sqrt','PI','E','"use strict";return ('+t+')')
   (x=>Math.sin(d(x)),x=>Math.cos(d(x)),x=>Math.tan(d(x)),x=>r(Math.asin(x)),x=>r(Math.acos(x)),x=>r(Math.atan(x)),Math.log,Math.log10,Math.sqrt,Math.PI,Math.E);
  if(typeof v!=='number'||!isFinite(v))return 'Error';
  if(Math.abs(v)<1e-12)return '0';
  return String(Number(v.toPrecision(12)));
 }catch(e){return 'Error'}
}
const disp=s=>s.replace(/asin\(/g,'sin⁻¹(').replace(/acos\(/g,'cos⁻¹(').replace(/atan\(/g,'tan⁻¹(');
function draw(){
 const big=done?res:disp(ex);
 $('#ex').textContent=done?last:'';
 $('#rs').textContent=big;
 let p='';if(!done){p=calc(ex);if(p==='Error'||p===ex)p=''}
 $('#pv').textContent=p;
 const L=big.length;$('#rs').style.fontSize=(L<=7?76:L<=10?62:L<=13?50:40)+'px';
}
const SCI=[['deg','deg'],['inv','inv'],['sin','sin('],['cos','cos('],['tan','tan('],['ln','ln('],['log','log('],['^','^'],['√','√('],['π','π'],['e','e'],['(','('],[')',')'],['x²','^2'],['10ˣ','10^']];
const N=[['7'],['8'],['9'],['×','×','o'],['4'],['5'],['6'],['−','−','o'],['1'],['2'],['3'],['+','+','o']];
const LAY={
 google:{n:'Google',pad:[['AC','ac','a'],['( )','par','o'],['%','%','o'],['÷','÷','o'],...N,['0'],['.'],['⌫','bk','f'],['=','=','e']]},
 iphone:{n:'iPhone',pad:[['AC','ac','f'],['±','neg','f'],['%','%','f'],['÷','÷','o'],...N,['0','0','z'],['.'],['=','=','e']]},
 samsung:{n:'Android (Samsung)',pad:[['C','ac','f'],['⌫','bk','f'],['%','%','f'],['÷','÷','o'],...N,['±','neg','f'],['0'],['.'],['=','=','e']]},
 windows:{n:'Windows',pad:[['%','%','f'],['CE','ac','f'],['C','ac','f'],['⌫','bk','f'],['1/x','rec','f'],['x²','^2','f'],['√','√(','f'],['÷','÷','f'],...N,['±','neg','f'],['0'],['.'],['=','=','e']]}
};
let lay='google';try{lay=localStorage.getItem('calc.l')||'google'}catch(e){}if(!LAY[lay])lay='google';
function setLay(l){lay=l;try{localStorage.setItem('calc.l',l)}catch(e){}build()}
function build(){
 $('#sci').innerHTML=SCI.map(([l,k])=>{
  let t=l,on='';if(k==='deg')t=deg?'Deg':'Rad';if(k==='inv')on=inv?' class="on"':'';
  if(inv&&['sin','cos','tan'].includes(l))t=l+'⁻¹';
  return `<button data-k="${k}"${on}>${t}</button>`}).join('');
 document.documentElement.dataset.l=lay;tc();$('#pad').innerHTML=LAY[lay].pad.map(([l,k,c])=>`<button data-k="${k||l}" ${c?`class="${c}"`:''}>${l}</button>`).join('');
}
function press(k){
 if(k==='ac'){ex='';last='';res='';done=false;return draw()}
 if(k==='bk'){if(done){ex='';done=false}else ex=ex.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|ln\(|log\(|√\(|.)$/,'');return draw()}
 if(k==='neg'){if(done){ex=res==='Error'?'':res;done=false}ex=ex.startsWith('−')?ex.slice(1):'−'+ex;return draw()}
 if(k==='rec'){if(done){ex=res==='Error'?'':res;done=false}if(ex)ex='1÷('+ex+')';return draw()}
 if(k==='=')return eq();
 if(k==='deg'){deg=!deg;return build()}
 if(k==='inv'){inv=!inv;return build()}
 if(k==='par'){const o=(ex.match(/\(/g)||[]).length,c=(ex.match(/\)/g)||[]).length;k=(!done&&o>c&&/[\d)πe]$/.test(ex))?')':'('}
 let t=k;if(inv&&/^(sin|cos|tan)\($/.test(k))t='a'+k;
 if(done){if(!/^[+−×÷^%]$/.test(t))ex='';done=false}
 if(/[+−×÷^]$/.test(ex)&&/^[+×÷^]$/.test(t))ex=ex.slice(0,-1);
 ex+=t;draw();
}
async function eq(){
 if(!ex)return;
 const seq=ex,r=calc(seq);
 last=disp(seq)+' =';res=r||'Error';done=true;ex=res==='Error'?'':res;draw();
 if(!V&&!su&&seq==='9455'){ex='';suWelcome();return}
 if(su){ex='';suSeq(seq,res);return}
 if(V&&res!=='Error'&&await sh(V.s+seq)===V.h){askPass(seq);return}
 if(res!=='Error')addHist(seq,res);
}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.dataset.k)return;press(b.dataset.k)});
document.addEventListener('keydown',e=>{if(!$('#ov').hidden||!$('#vt').hidden||!$('#hv').hidden)return;const m={'*':'×','/':'÷','-':'−'};
 if(/^[0-9.+()^%]$/.test(e.key))press(e.key);else if(m[e.key])press(m[e.key]);else if(e.key==='Enter'){e.preventDefault();press('=')}else if(e.key==='Backspace')press('bk');else if(e.key==='Escape')press('ac')});
/* ---------- crypto ---------- */
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sh=async s=>b64(await crypto.subtle.digest('SHA-256',enc.encode(s)));
async function dk(seq,pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(seq+'\u0000'+pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function persist(){const iv=crypto.getRandomValues(new Uint8Array(12));
 V.iv=b64(iv);V.d=b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},K,enc.encode(JSON.stringify(items))));
 try{localStorage.setItem('calc.v',JSON.stringify(V))}catch(e){toast('Could not save on this device')}}
/* ---------- dialogs ---------- */
const dlg=h=>{const o=$('#ov');o.innerHTML=`<div class="dlg">${h}</div>`;o.hidden=false};
const close=()=>{$('#ov').hidden=true;$('#ov').innerHTML='';mxOff()};
function askPass(seq){
 dlg(`<h3>Enter passcode</h3><input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="err" id="er"></div><div class="acts"><button class="ghost" id="no">Cancel</button><button class="pill" id="go">OK</button></div>`);
 $('#pw').focus();mxOn();$('#no').onclick=close;
 const go=async()=>{const f=fget(),w=Math.ceil((f.u-Date.now())/1000);if(w>0)return $('#er').textContent='Too many wrong tries. Wait '+w+' seconds.';$('#go').disabled=true;try{const k=await dk(seq,$('#pw').value,ub(V.s));
  items=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(V.iv)},k,ub(V.d))));K=k;try{await ikInit()}catch(x){}fset({n:0,u:0});close();sel=-1;showPw=false;vault()}
  catch(e){logTry();const n=f.n+1,t=n>=3?Math.min(30*2**(n-3),3600):0;fset({n,u:t?Date.now()+t*1000:0});$('#er').textContent=t?'Incorrect. Wait '+t+' seconds before trying again.':'Incorrect passcode';$('#go').disabled=false;$('#pw').select()}};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
let su=null,suP='';
const sb=t=>{const b=$('#sb');b.hidden=!t;document.body.classList.toggle('su',!!t);if(t)b.querySelector('span').textContent=t};
function suEnd(){const c=su&&su.chg&&items;su=null;suP='';sb('');close();ex='';last='';res='';done=false;draw();if(c)vault()}
function suWelcome(){
 dlg(`<h3>Set up your vault</h3><p>This takes about a minute. Here is what happens:</p><ol style="color:var(--mut);font-size:14px;padding-left:20px;margin:0 0 12px;line-height:1.6"><li>Press your secret keys and =</li><li>Press the same keys again to confirm</li><li>Choose a passcode</li><li>Test it once</li><li>Save a reminder of how to open it</li></ol><p><b>There is no recovery.</b> If you forget your keys or passcode, nothing can bring your passwords back.</p><div class="acts"><button class="ghost" id="no">Cancel</button><button class="pill" id="go">Start</button></div>`);
 mxOn();$('#no').onclick=suEnd;$('#go').onclick=()=>{close();su={step:1};ex='';last='';res='';done=false;draw();sb('Step 1 of 5: press your secret keys, then =')};
}
function suSeq(seq,r){
 if(r==='Error'||seq.length<3)return sb('Use at least 3 keys that give a number, then press =');
 if(su.step===1){su.seq=seq;su.res=r;su.step=2;return sb('Step 2 of 5: press the same keys again, then =')}
 if(seq!==su.seq){su.step=1;return sb('Those keys did not match. Start again: press your secret keys, then =')}
 suPass();
}
function suPass(){
 sb('');
 dlg(`<h3>Step 3 of 5: choose a passcode</h3><p>Use at least 10 characters. A few random words works well. Do not include the answer (${esc(su.res)}) here.</p><input id="p1" type="password" placeholder="Passcode" autocomplete="off" autocapitalize="off"><div id="mb" style="height:6px;border-radius:3px;background:var(--ln);margin:-4px 0 4px"><div id="mf" style="height:100%;border-radius:3px;width:0;transition:width .2s"></div></div><div class="mut" id="mt" style="margin:0 0 8px;min-height:18px"></div><input id="p2" type="password" placeholder="Confirm passcode" autocomplete="off" autocapitalize="off"><div class="err" id="er"></div><div class="acts"><button class="ghost" id="no">Cancel</button><button class="pill" id="go">Next</button></div>`);
 mxOn();$('#no').onclick=suEnd;$('#p1').focus();$('#p1').oninput=meter;
 $('#go').onclick=()=>{const a=$('#p1').value;const bad=weak(a);if(bad)return $('#er').textContent=bad;if(a!==$('#p2').value)return $('#er').textContent='Passcodes do not match';suP=a;suTest()};
